<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>❤️ Love You</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* 阶段1：爱心绘制 */
        #heart-stage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .heart-particle {
            position: absolute;
            font-size: 24px;
            color: #ff6b9d;
            text-shadow: 0 0 10px rgba(255, 107, 157, 0.8), 0 0 20px rgba(255, 107, 157, 0.4);
            animation: heartAppear 0.3s ease-out forwards;
            cursor: pointer;
            user-select: none;
            transition: transform 0.2s;
        }

        .heart-particle:hover {
            transform: scale(1.3);
        }

        @keyframes heartAppear {
            0% { transform: scale(0) rotate(-180deg); opacity: 0; }
            60% { transform: scale(1.2) rotate(10deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        /* 阶段2：满屏爱心弹窗 */
        #popup-stage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            display: none;
            overflow: hidden;
        }

        .love-popup {
            position: absolute;
            padding: 12px 24px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            color: #333;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.3);
            cursor: pointer;
            animation: popupIn 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
            user-select: none;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .love-popup::before {
            content: '❤️';
            font-size: 20px;
            animation: heartbeat 1s ease-in-out infinite;
        }

        @keyframes popupIn {
            0% { transform: scale(0) translateY(-50px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        /* 颜色主题 */
        .theme-pink { background: linear-gradient(135deg, #ffd1dc 0%, #ffb6c1 100%); }
        .theme-blue { background: linear-gradient(135deg, #b3e5fc 0%, #81d4fa 100%); }
        .theme-green { background: linear-gradient(135deg, #c8e6c9 0%, #a5d6a7 100%); }
        .theme-yellow { background: linear-gradient(135deg, #fff9c4 0%, #fff59d 100%); }
        .theme-hot { background: linear-gradient(135deg, #f48fb1 0%, #f06292 100%); color: white; }
        .theme-sky { background: linear-gradient(135deg, #e1f5fe 0%, #b3e5fc 100%); }

        /* 点击关闭提示 */
        #hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            z-index: 100;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* 背景星星 */
        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.5); }
        }

        /* 结束动画 */
        .fade-out {
            animation: fadeOut 1s ease-out forwards;
        }

        @keyframes fadeOut {
            to { opacity: 0; transform: scale(0.8); }
        }
    </style>
</head>
<body>
    <div id="heart-stage"></div>
    <div id="popup-stage"></div>
    <div id="hint">点击任意爱心关闭所有窗口</div>

    <script>
        // ====================== 【这里随便调参数】 ======================
        const HEART_SHOW_TIME = 1500;    // 爱心显示多久后跳满屏（毫秒）
        const POPUP_SPEED = 30;          // 满屏弹窗间隔（毫秒，越小越快）
        const TOTAL_RUN_TIME = 8000;     // 总运行多少毫秒后自动关闭
        const HEART_COUNT = 180;         // 组成大爱心的小爱心数量
        // =================================================================

        const textList = [
            'I love you',
            '我爱你',
            '愛してる',
            '사랑해',
            'Я люблю тебя',
            "Je t'aime",
            'Ich liebe dich',
            'मैं तुमसे प्यार करता हूँ'
        ];

        const colorThemes = ['theme-pink', 'theme-blue', 'theme-green', 'theme-yellow', 'theme-hot', 'theme-sky'];

        const heartStage = document.getElementById('heart-stage');
        const popupStage = document.getElementById('popup-stage');
        const hint = document.getElementById('hint');
        let allPopups = [];
        let isRunning = true;

        // 创建背景星星
        function createStars() {
            for (let i = 0; i < 50; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                star.style.animationDuration = (2 + Math.random() * 3) + 's';
                document.body.appendChild(star);
            }
        }

        // 生成爱心形状的点
        function createHeartPoints(n, scale = 22) {
            const points = [];
            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;
            for (let i = 0; i < n; i++) {
                const t = (i / n) * 2 * Math.PI;
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
                const wx = Math.max(0, Math.min(cx + x * scale - 75, window.innerWidth - 150));
                const wy = Math.max(0, Math.min(cy - y * scale - 20, window.innerHeight - 40));
                points.push({ x: wx, y: wy, delay: i * 8 });
            }
            return points;
        }

        // 创建爱心粒子
        function createHeartParticle(x, y) {
            const heart = document.createElement('div');
            heart.className = 'heart-particle';
            heart.innerHTML = '❤️';
            heart.style.left = x + 'px';
            heart.style.top = y + 'px';
            heartStage.appendChild(heart);
            return heart;
        }

        // 创建弹窗爱心
        function createLovePopup(x, y) {
            const popup = document.createElement('div');
            popup.className = 'love-popup ' + colorThemes[Math.floor(Math.random() * colorThemes.length)];
            popup.textContent = textList[Math.floor(Math.random() * textList.length)];
            popup.style.left = x + 'px';
            popup.style.top = y + 'px';
            popup.onclick = () => closeAll();
            popupStage.appendChild(popup);
            allPopups.push(popup);
            return popup;
        }

        // 关闭所有
        function closeAll() {
            if (!isRunning) return;
            isRunning = false;

            allPopups.forEach(p => {
                p.classList.add('fade-out');
                setTimeout(() => p.remove(), 1000);
            });

            const hearts = document.querySelectorAll('.heart-particle');
            hearts.forEach(h => {
                h.classList.add('fade-out');
                setTimeout(() => h.remove(), 1000);
            });

            hint.style.display = 'none';

            setTimeout(() => {
                popupStage.innerHTML = '';
                heartStage.innerHTML = '';
            }, 1200);
        }

        // 阶段1：绘制爱心
        async function drawHeart() {
            const points = createHeartPoints(HEART_COUNT);

            for (const point of points) {
                if (!isRunning) return;
                createHeartParticle(point.x, point.y);
                await new Promise(r => setTimeout(r, 8));
            }

            // 爱心停留
            await new Promise(r => setTimeout(r, HEART_SHOW_TIME));

            // 清除爱心，进入阶段2
            heartStage.innerHTML = '';
            heartStage.style.display = 'none';
            popupStage.style.display = 'block';
        }

        // 阶段2：满屏弹窗
        async function startPopupStorm() {
            const startTime = Date.now();

            while (isRunning && (Date.now() - startTime < TOTAL_RUN_TIME)) {
                const x = Math.random() * (window.innerWidth - 150);
                const y = Math.random() * (window.innerHeight - 50);
                createLovePopup(x, y);
                await new Promise(r => setTimeout(r, POPUP_SPEED));
            }

            if (isRunning) {
                closeAll();
            }
        }

        // 主流程
        async function main() {
            createStars();
            await drawHeart();
            if (isRunning) {
                startPopupStorm();
            }
        }

        // 启动
        main();

        // 窗口大小改变时重置
        window.addEventListener('resize', () => {
            if (!isRunning) return;
            // 简单的防抖，实际使用可优化
        });
    </script>
</body>
</html>
